name: Visual or content bug
description: Something is cropped, overflowing, wrong, or leaking a live figure.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: seen
    attributes:
      label: What did you see
      description: What is wrong, and on which width (desktop or phone)?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should it be
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This report does not include live account numbers, real NLV, or credentials.
          required: true
